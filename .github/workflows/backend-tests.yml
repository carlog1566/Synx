name: Backend Tests

on:
    pull_request:
        branches:
            - main
            - dev
            
    push:
        branches:
            - main
            - dev

    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    backend-tests:
        name: Django Backend Tests
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:18
                env:
                    POSTGRES_DB: synx_test
                    POSTGRES_USER: synx
                    POSTGRES_PASSWORD: testpassword
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U synx -d synx_test"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        
        env:
            SECRET_KEY: django-ci-test-key-not-for-production
            DEBUG: "True"
            DATABASE_URL: postgres://synx:testpassword@localhost:5432/synx_test
            GOOGLE_CLIENT_ID: dummy-google-client-id
            RESEND_API_KEY: dummy-resend-api-key
            FRONTEND_URL: http://localhost:5173
            USE_S3: "False"

        defaults:
            run:
                working-directory: backend

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.14"
                cache: pip
                cache-dependency-path: backend/requirements.txt

            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt

            - name: Check Django configuration
              run: python manage.py check
            
            - name: Check for missing migrations
              run: python manage.py makemigrations --check --dry-run

            - name: Run tests with coverage
              run: |
                coverage run manage.py test api songs
                coverage report -m --fail-under=70